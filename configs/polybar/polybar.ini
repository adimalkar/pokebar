; PokeBar - Polybar Module Configuration Snippet
; Add "pokemon" to your modules-left, modules-center, or modules-right in polybar config

[module/pokemon]
type = custom/script
exec = $HOME/.config/pokebar/scripts/pokecycle
interval = 0.12
format = <label>
click-left = $HOME/.local/bin/pokebar interact
click-right = $HOME/.local/bin/pokebar next
click-middle = $HOME/.local/bin/pokebar random
